# Static hosting for the download page. The .dmg itself lives on GitHub
# Releases — Render's free tier is not the place for a 118 MB binary, and
# Releases gives versioning and download counts for free.
services:
  - type: web
    name: relex-site
    runtime: static
    staticPublishPath: ./site
    # Nothing to compile: site/ is plain HTML and two images.
    buildCommand: ""
    headers:
      - path: /*
        name: X-Content-Type-Options
        value: nosniff
      - path: /*.png
        name: Cache-Control
        value: public, max-age=604800
    routes:
      - type: rewrite
        source: /*
        destination: /index.html
